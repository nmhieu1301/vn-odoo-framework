[options]
; Odoo prepends the two source addon directories itself, so only the local
; groups are listed. Each entry must be a directory that holds modules directly,
; which is why the OCA repos are listed one by one rather than as ./oca.
addons_path =
    /mnt/extra-addons/custom-addons,
    /mnt/extra-addons/vn-odoo-framework,
    /mnt/extra-addons/oca/account-financial-tools,
    /mnt/extra-addons/oca/reporting-engine
data_dir = /var/lib/odoo

; No db_* here: entrypoint.sh exports PGHOST/PGPORT/PGUSER and a PGPASSFILE,
; which Odoo and libpq read directly. One source of truth.
; No admin_passwd here either: entrypoint.sh exports it as ODOO_ADMIN_PASSWD,
; and env options outrank the config file.
list_db = True
; dbfilter = ^odoo19.*$

http_enable = True
http_interface = 0.0.0.0
http_port = 8069
; gevent_port is only served when workers > 0
gevent_port = 8072
proxy_mode = False

; workers = 0 is required for --dev=reload
workers = 0
max_cron_threads = 2
limit_time_cpu = 600
limit_time_real = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

log_level = info
log_handler = :INFO
logfile = None
