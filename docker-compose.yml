services:
  web:
    build:
      context: .
      args:
        # Must match the host account that owns ./odoo, ./addons and ./secrets,
        # otherwise the bind mounts are unreadable inside the container.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: odoo19-web:uid${UID:-1000}
    container_name: odoo19-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT:-8069}:8069"
      - "${ODOO_WS_PORT:-8072}:8072"
    environment:
      # Standard libpq names, which Odoo 19 reads natively.
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-odoo}
      # Paths, not values. entrypoint.sh turns them into a .pgpass and a runtime
      # config; see the comments there.
      PGPASSWORD_FILE: /run/secrets/postgres_password
      ODOO_ADMIN_PASSWD_FILE: /run/secrets/odoo_admin_passwd
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./odoo:/opt/odoo
      - ./config:/etc/odoo
      - ./addons/custom-addons:/mnt/extra-addons/custom-addons
      - ./addons/vn-odoo-framework:/mnt/extra-addons/vn-odoo-framework
      - ./addons/oca/account-financial-tools:/mnt/extra-addons/oca/account-financial-tools
      - ./addons/oca/reporting-engine:/mnt/extra-addons/oca/reporting-engine
    tmpfs:
      # entrypoint.sh materialises the secrets here; tmpfs keeps them off disk.
      - /tmp
    secrets:
      - postgres_password
      - odoo_admin_passwd
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8069/web/static/img/favicon.ico"]
      interval: 60s
      start_interval: 2s
      timeout: 5s
      retries: 5
      start_period: 90s

  db:
    image: postgres:16
    container_name: odoo19-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      start_interval: 1s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Uncomment to reach the database from the host.
    # ports:
    #   - "5433:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_password
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    secrets:
      - pgadmin_password

volumes:
  odoo-web-data:
  odoo-db-data:
  pgadmin-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  odoo_admin_passwd:
    file: ./secrets/odoo_admin_passwd
  pgadmin_password:
    file: ./secrets/pgadmin_password
